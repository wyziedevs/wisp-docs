<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbfe" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b24" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <noscript><style>.copy-icon,.theme,.search .key,.useful,.view form,.view .remove{display:none}</style></noscript>
  %wisp.head%
</head>
<body>
  %wisp.body%
</body>
</html>
