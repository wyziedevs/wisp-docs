<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbfe" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b24" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='dark'?'#1c1b24':'#fcfbfe';m.media='all'})}}catch(e){}</script>
  <noscript><style>.copy-icon,.theme,.search .key,.useful{display:none!important}</style></noscript>
  %wisp.head%
</head>
<body>
  %wisp.body%
</body>
</html>
