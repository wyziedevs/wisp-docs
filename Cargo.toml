[package]
name = "wisp-docs"
version = "0.1.0"
edition = "2024"

[dependencies]
wisp = { package = "wisp-web-rt", path = "../wisp/crates/wisp" }

[build-dependencies]
wisp-build = { package = "wisp-web-build", path = "../wisp/crates/wisp-build" }

# `cargo test --features browser` runs the tests in a headless Chrome or Edge.
[features]
browser = ["wisp/browser"]

# Dev builds near release speed, and rebuilds as fast as unoptimized ones.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"

[package.metadata.wisp]
redirects = [
  "/docs/design-app /docs/design 301",
  "/docs/design-templates /docs/design-syntax 301",
  "/docs/design-images /docs/design-tooling 301",
  "/docs/design-i18n /docs/design-tooling 301",
  "/docs/design-ui /docs/design-forms 301",
  "/docs/design-parity /docs/design-features 301",
  "/docs/design-build /docs/design-runtime 301",
  "/docs/design-security /docs/design-cli 301",
  "/docs/plan /docs/overview 301",
]
